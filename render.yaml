# Render Blueprint — RelayOps ML scoring service (M5 deployment prep).
#
# Build, from a clean checkout:
#   1. pip install -r requirements.txt
#   2. python scripts/fetch_data.py      — download the C-MAPSS files into
#      data/. scripts/train_service.py assumes data/ already exists and
#      does NOT download; fetch_data.py is the project's data-fetch path
#      (stdlib only, unwraps the NASA distribution's zip-in-a-zip).
#   3. python scripts/train_service.py   — train the artifact bundle into
#      models/. Files written during the build are part of the deploy
#      slug, so the bundle is present when the service starts.
#
# The service fails fast at startup if models/ is missing or stale, so a
# broken build cannot silently serve. /healthz is unauthenticated (see
# api/main.py), which is what healthCheckPath probes; the scoring
# endpoints require X-API-Key when RELAYOPS_ML_API_KEY is set.
services:
  - type: web
    name: relayops-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/fetch_data.py && python scripts/train_service.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Match the version the bundle is developed/tested against
      # (requirements.txt pins are built for CPython 3.12).
      - key: PYTHON_VERSION
        value: 3.12.3
      # Shared secret for the scoring endpoints. sync: false = set the
      # value in the Render dashboard, never commit it. Leave unset to
      # run the demo with no auth (the API's documented demo scope).
      - key: RELAYOPS_ML_API_KEY
        sync: false
